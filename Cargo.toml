[package]
name = "esrgan_rs"
version = "1.0.0"
edition = "2024"

[lib]
name = "esrgan_rs"
path = "src/lib.rs"

[[bin]]
name = "esrgan"
path = "src/bin/main.rs"

[profile.dev]
opt-level = 1
lto = "off"
debug = "full"

[profile.release]
opt-level = 3
lto = "fat"
debug = false

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
image = "0.25.10"
anyhow = "1.0.104"

prost = "0.14.6"
memmap2 = "0.9.12"
rayon = "1.12.0"
rustc-hash = "2.1.3"
sha2 = "0.11.1"
hex = "0.4.3"
